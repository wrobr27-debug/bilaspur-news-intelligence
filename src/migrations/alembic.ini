[alembic]
script_location = src/migrations
pythonpath = src
template = jinja2

# Log configuration
[loggers]
keys = root, sqlalchemy.runtime

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy.runtime]
level = INFO
handlers = console
handlers = console
qualname = sqlalchemy.runtime