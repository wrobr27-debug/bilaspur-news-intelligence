[project]
name = "bilaspur-news-intelligence"
version = "0.1.0"
description = "Bilaspur News Intelligence Engine - Source Collection System"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "psycopg[binary]>=3.0",
    "google-api-python-client>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
collect = "src.main:run_cli"
collect-source = "src.main:run_collect_source"
list-sources = "src.main:list_sources"
sources-check = "src.main:check_sources"
health = "src.main:run_health"