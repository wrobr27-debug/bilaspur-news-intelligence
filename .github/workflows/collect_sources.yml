name: Collect Sources

on:
  schedule:
    # Run every 15 minutes - configurable per source in database
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab
    inputs:
      source_id:
        description: 'Collect specific source ID (optional)'
        required: false
        default: ''

jobs:
  collect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    concurrency:
      group: bilaspur-source-collection
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      LOG_LEVEL: INFO
      COLLECTION_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Do NOT persist credentials - we use GitHub Secrets only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate deployment configuration
        run: python -m src.main check-config

      - name: Run database migrations
        run: python -m alembic -c src/migrations/alembic.ini upgrade head

      - name: Verify required tables exist
        run: |
          python -c "
          from sqlalchemy import create_engine, inspect
          import os
          url = os.environ.get('DATABASE_URL', 'sqlite:///./data/bilaspur_news.db')
          if url.startswith('postgresql://') and '+psycopg' not in url:
              url = url.replace('postgresql://', 'postgresql+psycopg://', 1)
          engine = create_engine(url, poolclass=None)
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          required = {'sources', 'collected_items', 'collection_runs', 'source_health', 'alembic_version'}
          missing = required - set(tables)
          if missing:
              print(f'MISSING TABLES: {missing}')
              exit(1)
          print(f'All required tables present: {sorted(tables)}')
          "

      - name: Initialize source registry
        run: python -m src.main seed

      - name: Execute collection pipeline
        run: |
          if [ -n "${{ inputs.source_id }}" ]; then
            python -m src.main collect --source "${{ inputs.source_id }}"
          else
            python -m src.main collect
          fi

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7