name: Collect Sources

on:
  schedule:
    # Run every 15 minutes - configurable per source in database
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab
    inputs:
      source_id:
        description: 'Collect specific source ID (optional)'
        required: false
        default: ''
      social:
        description: 'Enable social media scrapers (Twitter, Instagram)'
        required: false
        default: 'false'

jobs:
  collect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: bilarpur-source-collection
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      TWITTER_HANDLE: ${{ secrets.TWITTER_HANDLE }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
      LOG_LEVEL: INFO
      COLLECTION_TIMEZONE: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate deployment configuration
        run: python -m src.main check-config

      - name: Run database migrations
        run: python -m alembic -c src/migrations/alembic.ini upgrade head

      - name: Verify required tables exist
        run: |
          python -c "
          from sqlalchemy import create_engine, inspect
          import os
          url = os.environ.get('DATABASE_URL', 'sqlite:///./data/bilaspur_news.db')
          if url.startswith('postgresql://') and '+psycopg' not in url:
              url = url.replace('postgresql://', 'postgresql+psycopg://', 1)
          engine = create_engine(url, poolclass=None)
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          required = {'sources', 'collected_items', 'collection_runs', 'source_health', 'alembic_version'}
          missing = required - set(tables)
          if missing:
              print(f'MISSING TABLES: {missing}')
              exit(1)
          print(f'All required tables present: {sorted(tables)}')
          "

      - name: Initialize source registry
        run: python -m src.main seed

      - name: Execute collection pipeline
        env:
          COLLECT_SOCIAL: ${{ inputs.social }}
        run: |
          if [ -n "${{ inputs.source_id }}" ]; then
            python -m src.main collect --source "${{ inputs.source_id }}"
          else
            if [ "${{ inputs.social }}" = "true" ]; then
              python -m src.main collect --social
            else
              python -m src.main collect
            fi
          fi

      - name: Build static dashboard
        run: python src/build_static.py

      - name: Export dashboard data
        run: python src/export_dashboard_data.py

      - name: Commit and Push database changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git add docs/ || true
          git commit -m "Auto-update news data [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
